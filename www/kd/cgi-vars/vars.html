<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/styles.css" />
	<script src="/js/contact.js" defer></script>
  <script lang="javascript">
    function send_form(path)
    {
      var f = document.getElementById('vars-form');
      var g1 = document.querySelector('#g1');
      var g2 = document.querySelector('#g2');

      path += "?g1=" + g1.value;
      path += "&g2=" + g2.value;
      f.action = path;
    }
  </script>
    <title>Webserv - GET / POST vars to CGI</title>
  </head>

  <body>
    <header>
    <section id="contact">
      <p>Set variables to be passed to a CGI script via POST</p>
      <form id="vars-form" action="vars.php" method="post">
        <div class="input-container">
          <label for="g1">get (1)</label>
          <input type="text" id="g1" name="g1" value="one" />
        </div>
        <div class="input-container">
          <label for="g2">get (2)</label>
          <input type="text" id="g2" name="g2" value="two" />
        </div>
        <div class="input-container">
          <label for="p1">post (1)</label>
          <input type="text" id="p1" name="p1" value="three" />
        </div>
        <div class="input-container">
          <label for="p2">post (2)</label>
          <input type="text" id="p2" name="p2" value="four" />
        </div>

        <div class="oneline">
        <button class="" onclick="send_form('vars.php');">
              <span class="method">POST - PHP</span>
		    </button>
        <button class="" onclick="send_form('vars.py');">
              <span class="method">POST - python</span>
		    </button>
        <button class="" onclick="send_form('vars.pl');" value="">
              <span class="method">POST - perl</span>
		    </button>
        </div>
      </form>
    </section>
    <footer>
      <div>© Kevin Donlon, Noa Houssier, Maxime Marti</div>
      <a
        href="https://github.com/NestorNebula/webserv"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img id="gh-icon" src="/assets/icons/github.svg" alt="GitHub" />
      </a>
      <div>2026</div>
    </footer>
  </body>
</html>
