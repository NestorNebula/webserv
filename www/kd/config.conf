# www/nh/config.conf
server {
	listen: 8080 

	# Global config
#kd - add ../nh
	root: ../nh
	methods: GET
	max_body_size: 1m

	# Global error pages
#kd - add ../common
	error_page default: ../common/errors/default.html
	error_page 404: ../common/errors/404.html

#kd : new requirements
	index: index.html

	route / {
#kd
		root: ../nh/html
		index: index.html
	}

	route /css {
		root: ../common/css
	}

	route /js {
		root: ../common/js
	}

	route /assets {
		root: ../common/assets
	}

	route /old {
		redirect: /
	}

	route /uploads {
#kd : ATTN 
#kd : root: here is NOT APPENDED to "primary" root
#kd : it is RELATIVE to the CONFIG_DIR
		root: ../nh/uploads
		methods: GET, POST, DELETE
		max_body_size: 100m 
		upload: on
		upload_dir: .
		autoindex: on
	}

	route /messages {
		root: ../nh/messages
		methods: GET, POST
		upload: on
		upload_dir: .
		autoindex: on
	}

	#route /cgi {
		#root: ./cgi
		#cgi .php: /usr/bin/php-cgi
	#}
}

