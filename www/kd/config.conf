server {
	listen: 8082

	# Global config
	# relative path was assumed somewhere 
# WEBSERV : MUST BE SET - CgiEnv
	root: ./
	methods: GET, POST
	max_body_size: 1m
	# autoindex: on -- not global

	fcgi_sock: ../../bonus/.php-fpm/SOCK

	# Global error pages
	error_page default: ../common/errors/default.html
	error_page 400: ../common/errors/400.html
	error_page 403: ../common/errors/403.html
	error_page 404: ../common/errors/404.html
	error_page 405: ../common/errors/405.html
	error_page 408: ../common/errors/408.html
	error_page 413: ../common/errors/413.html
	error_page 431: ../common/errors/431.html
	error_page 500: ../common/errors/500.html
	error_page 501: ../common/errors/501.html
	error_page 502: ../common/errors/502.html
	error_page 503: ../common/errors/503.html
	error_page 504: ../common/errors/504.html
	error_page 505: ../common/errors/505.html

#kd : new requirements
	index: index.html


	route /css {
		root: ../common/css
	}
	route /assets {
		root: ../common/assets
	}
	pycgi_dir: ../../bonus/legacy-cgi-2.6

	route / {
		root: ./
		# index: index.html
		autoindex: on
		cgi .php: /usr/bin/php-cgi
		cgi .py: /usr/bin/python3
		cgi .pl: /usr/bin/perl
	}
	route /files {
		autoindex: on
# WEBSERV : error with no root set (?)
# -- "Directory listing" string is dangerous
		root: ./files
	}
	route /vids {
		root: /home/kdonlon/Videos
		methods: GET
		max_body_size: 1m 
		autoindex: on
	}
	# route /long {
	# 	root: /media/kdonlon/data/Videos
	# 	methods: GET
	# 	max_body_size: 1m 
	# 	autoindex: on
	# }

	route /uploads {
		root: ./uploads
		methods: GET, POST, DELETE
		max_body_size: 5m 
		upload: on
		upload_dir: .
		autoindex: on
	}
}

