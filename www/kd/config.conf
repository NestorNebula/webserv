server {
	listen: 8082

	# Global config
	# relative path was assumed somewhere 
# WEBSERV : MUST BE SET - CgiEnv
	root: ./
	methods: GET, POST
	max_body_size: 1m
	# autoindex: on -- not global

	fcgi_sock: ../../bonus/.php-fpm/SOCK
	pycgi_dir: ../../bonus/legacy-cgi-2.6

	# Global error pages
	error_page default: ../common/errors/default.html
	error_page 404: ../common/errors/404.html
	error_page 500: ../common/errors/500.html
	error_page 503: ../common/errors/503.html
	error_page 504: ../common/errors/504.html

	route /css {
		root: ../common/css
	}
	route /assets {
		root: ../common/assets
	}
	route / {
		root: ./
		index: index.html
		# autoindex: on
		cgi .php: /usr/bin/php-cgi
		cgi .py: /usr/bin/python3
		cgi .pl: /usr/bin/perl
	}
	route /files {
		autoindex: on
# WEBSERV : error with no root set (?)
# -- "Directory listing" string is dangerous
		root: ./files
	}
	route /vids {
		root: /home/kdonlon/Videos
		methods: GET
		max_body_size: 100m 
		# autoindex: on
	}

	route /uploads {
		root: ./uploads
		methods: GET, POST, DELETE
		max_body_size: 5m 
		upload: on
		upload_dir: .
		autoindex: on
	}
}

# .cgi files should return an ERROR if CGI is not enabled from that directory
