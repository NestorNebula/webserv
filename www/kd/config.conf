# www/nh/config.conf
server {
	listen: localhost:9999
	max_body_size: 1m
	route / {
		root: /home/kdonlon
	}
	methods: GET
	index: index.html
	autoindex: on
	error_page default: ../common/errors/default.html
}

server {
	listen: localhost:8080

	# Global config
	root: ../nh
  index: index.html, styles.css
	methods: GET
	max_body_size: 1m

	# Global error pages
	error_page default: ../common/errors/default.html
	error_page 400: ../common/errors/400.html
	error_page 403: ../common/errors/403.html
	error_page 404: ../common/errors/404.html
	error_page 405: ../common/errors/405.html
	error_page 408: ../common/errors/408.html
	error_page 413: ../common/errors/413.html
	error_page 415: ../common/errors/415.html
	error_page 431: ../common/errors/431.html
	error_page 500: ../common/errors/500.html
	error_page 501: ../common/errors/501.html
	error_page 502: ../common/errors/502.html
	error_page 503: ../common/errors/503.html
	error_page 504: ../common/errors/504.html
	error_page 505: ../common/errors/505.html

	route / {
		root: ../nh/html
		index: index.html
	}

	route /css {
		root: ../common/css
	}

	route /js {
		root: ../common/js
	}

	route /assets {
		root: ../common/assets
	}

	route /old {
		redirect: /
	}

	route /uploads {
		root: ../nh/uploads
		methods: GET, POST, DELETE
		max_body_size: 100m
		upload: on
		upload_dir: ../nh/uploads
		autoindex: on
	}

	route /messages {
		root: ../nh/messages
		methods: GET, POST
		upload: on
		upload_dir: ../nh/messages
		autoindex: on
	}

	#route /cgi {
		#root: ./cgi
		#cgi .php: /usr/bin/php-cgi
	#}
}







