<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/styles.css" />
	<script src="/js/contact.js" defer></script>
  <script lang="javascript">
    function send_form(path)
    {
      var f = document.getElementById('vars-form');
      f.action = path;
    }
  </script>
    <title>Webserv - pass CODE to CGI</title>
  </head>

  <body>
    <header>
    <section id="contact">
      <p>Set a code to be passed to a CGI script</p>
      <form id="vars-form" action="index.html" method="post">
        <div class="input-container">
          <label for="code">code</label>
          <input type="text" id="code" name="code" value="1" />
        </div>

        <div class="oneline">
        <button class="" onclick="send_form('exit.php');">
              <span class="method">EXIT - PHP</span>
		    </button>
        <button class="" onclick="send_form('exit.py');">
              <span class="method">EXIT - python</span>
		    </button>
        <button class="" onclick="send_form('exit.pl');">
              <span class="method">EXIT - perl</span>
		    </button>
        <br/>
        <button class="" onclick="send_form('stat.php');">
              <span class="method">STATUS - PHP</span>
		    </button>
        <button class="" onclick="send_form('stat.py');">
              <span class="method">STATUS - python</span>
		    </button>
        <button class="" onclick="send_form('stat.pl');">
              <span class="method">STATUS - perl</span>
		    </button>
        </div>
      </form>
    </section>
    <footer>
      <div>© Kevin Donlon, Noa Houssier, Maxime Marti</div>
      <a
        href="https://github.com/NestorNebula/webserv"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img id="gh-icon" src="/assets/icons/github.svg" alt="GitHub" />
      </a>
      <div>2026</div>
    </footer>
  </body>
</html>
