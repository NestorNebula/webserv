<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/styles.css" />
	<script src="/js/contact.js" defer></script>
  <script lang="javascript">
    function send_form(path)
    {
      var f = document.getElementById('vars-form');
      f.action = path;
    }
  </script>
    <title>Webserv - pass CODE to CGI</title>
  </head>

  <body>
    <header>
    <section id="contact">
      <p>Select a file to upload using CGI</p>
      <form id="vars-form" action="ul.php" method="post" enctype="multipart/form-data">
        <div class="input-container">
          <label for="file">FILE</label>
          <input type="file" id="file" name="file" value="" />
        </div>
        <div class="oneline">
        <button class="" onclick="send_form('ul.php');">
              <span class="method">PHP</span>
		    </button>
        <button class="" onclick="send_form('ul.py');">
              <span class="method">PYTHON</span>
		    </button>
        <button class="" onclick="send_form('ul.pl');">
              <span class="method">PERL</span>
		    </button>
        </div>
      </form>
    </section>
    <footer>
      <div>© Kevin Donlon, Noa Houssier, Maxime Marti</div>
      <a
        href="https://github.com/NestorNebula/webserv"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img id="gh-icon" src="/assets/icons/github.svg" alt="GitHub" />
      </a>
      <div>2026</div>
    </footer>
  </body>
</html>
