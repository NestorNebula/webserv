server {
    listen: 8080
    max_body_size: 10m
    root: ./demo
    index: index.html, home.html
    methods: GET

    error_page default: ./demo/errors/default.html
    error_page 404: ./demo/errors/404.html
    error_page 403: ./demo/errors/403.html

    pycgi_dir: ./demo/cgi-bin

    route / {
        methods: GET
    }

    route /assets {
        root: ./demo/assets
        methods: GET
        autoindex: on
    }

    route /upload {
        root: ./demo/upload
        methods: GET, POST
        max_body_size: 100m
        upload: on
        upload_dir: ./demo/upload
    }

    route /old-site {
        redirect: /
    }

    route /cgi-bin {
        root: ./demo/cgi-bin
        methods: GET, POST
        cgi .py: /usr/bin/python3
        cgi .php: /bin/bash
    }
}

server {
    listen: 127.0.0.1:8081
    max_body_size: 1m
    root: ./demo/api
    index: api.json
    methods: GET, POST, DELETE

    error_page default: ./demo/errors/default.html
    error_page 500: ./demo/errors/500.html

    route / {
        methods: GET
    }

    route /delete-data {
        methods: DELETE
    }
}
